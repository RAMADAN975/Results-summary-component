<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Results summary component</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="assets/fonts/static/HankenGrotesk-Bold.ttf" />
  </head>
  <body>
    <div class="main">
      <div class="card">
        <div class="min-card">
          <h3>Your Result</h3>
          <div class="circle">
            <h1>76</h1>
            <h5>of 100</h5>
          </div>
          <h3 style="color: white; font-size: 2rem">Great</h3>
          <p>
            You scored higher than 65% of the peaple who have taken these tests.
          </p>
        </div>

        <div class="summary">
          <p>Summary</p>
          <div class="btns">
            <ul>
              <li>
                <span>
                  <img
                    src="assets/images/icon-reaction.svg"
                    alt="reaction value"
                    Reaction
                  />
                  Reaction
                </span>
                80 / 100
              </li>
              <li>
                <span>
                  <img src="assets/images/icon-memory.svg" alt="Memory icon" />
                  Memory
                </span>
                92 / 100
              </li>
              <li>
                <span>
                  <img src="assets/images/icon-verbal.svg" alt="Verbal icon" />
                  Verbal</span
                >
                61 / 100
              </li>
              <li>
                <span>
                  <img src="assets/images/icon-visual.svg" alt="visual icon" />
                  Visual
                </span>
                73 / 100
              </li>
            </ul>
          </div>

          <button>Continue</button>
        </div>
      </div>
    </div>
  </body>
</html>
